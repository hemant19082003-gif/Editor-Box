

<html>
<head>
<title>Textora Editor</title>

<style>


body {
    background:lightgray;
    display: flex;
    justify-content: center;
    align-items: center;
}

.box {
    width: 650px;
    
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 10px 30px #0002;
}

h1 {
    text-align: center;
    color: #6d28d9;
    margin-bottom: 8px;
}

p {
    text-align: center;
}

.font {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
}

select, button {
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 7px;
    cursor: pointer;
    background: white;
}



button:hover {
    background: #ede9fe;
}

.editor {
    width: 90%;
    height: 220px;
    padding: 18px;
    border: 2px solid #a488e5;
    border-radius: 10px;
    
}

.colors {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.circle {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid #ddd;
    cursor: pointer;
}


.actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
}


</style>
</head>

<body>

<div class="box" style="background:rgb(250, 221, 225)">

    <h1>Textora Editor</h1>
    <p> Customize Your Text Your Way </p>


    <div class="font">

        <select id="fontFamily">
            <option value="Arial">Arial</option>
            <option value="Georgia">Georgia</option>
            <option value="Verdana">Verdana</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Trebuchet MS">Trebuchet MS</option>
            <option value="Impact">Impact</option>
            <option value="Comic Sans MS">Comic Sans MS</option>
            <option value="Lucida Console">Lucida Console</option>
            <option value="Palatino Linotype">Palatino Linotype</option>
            <option value="Tahoma">Tahoma</option>
        </select>

        <select id="fontSize">
            <option value="14px">14px</option>
            <option value="16px">16px</option>
            <option value="18px">18px</option>
            <option value="22px">22px</option>
            <option value="26px">26px</option>
            <option value="32px">32px</option>
            <option value="40px">40px</option>
        </select>

        </div>

    
    <div class="editor"
         id="editor"
         contenteditable="true"
         spellcheck="true">
    </div>

    <div>
        <h3> Background Color</h3>

        <div class="colors" >

            <div class="circle" style="background:red" onclick="changeBackground('red')"></div>
            <div class="circle" style="background:orange" onclick="changeBackground('orange')"></div>
            <div class="circle" style="background:yellow" onclick="changeBackground('yellow')"></div>
            <div class="circle" style="background:green" onclick="changeBackground('green')"></div>
            <div class="circle" style="background:blue" onclick="changeBackground('blue')"></div>
            <div class="circle" style="background:purple" onclick="changeBackground('purple')"></div>
            <div class="circle" style="background:pink" onclick="changeBackground('pink')"></div>
            <div class="circle" style="background:black" onclick="changeBackground('black')"></div>
            <div class="circle" style="background:gray" onclick="changeBackground('gray')"></div>
            <div class="circle" style="background:cyan" onclick="changeBackground('cyan')"></div>
            <div class="circle" style="background:lime" onclick="changeBackground('lime')"></div>
            <div class="circle" style="background:white" onclick="changeBackground('white')"></div>

        </div>
    </div>


    <div>
        <h3> Text Color </h3>

        <div class="colors">

            <div class="circle" style="background:black" onclick="changeTextColor('black')"></div>
            <div class="circle" style="background:red" onclick="changeTextColor('red')"></div>
            <div class="circle" style="background:blue"  onclick="changeTextColor('blue')"></div>
            <div class="circle" style="background:green" onclick="changeTextColor('green')"></div>
            <div class="circle" style="background:purple"  onclick="changeTextColor('purple')"></div>
            <div class="circle" style="background:orange"  onclick="changeTextColor('orange')"></div>
            <div class="circle" style="background:pink" onclick="changeTextColor('pink')"></div>
            <div class="circle" style="background:white" onclick="changeTextColor('white')"></div>
            <div class="circle" style="background:cyan" onclick="changeTextColor('cyan')"></div>
            <div class="circle" style="background:brown" onclick="changeTextColor('brown')"></div>
            <div class="circle" style="background:gray" onclick="changeTextColor('gray')"></div>
            <div class="circle" style="background:lime" onclick="changeTextColor('lime')"></div>

        </div>
    </div>

   
    <div class="actions">
        <button onclick="clearEditor()">Clear Text</button>
        <button onclick="resetEditor()">Reset Style</button>
    </div>

</div>

<script>

const editor = document.getElementById("editor");

function changeBackground(color) { editor.style.backgroundColor = color; }
function changeTextColor(color) { editor.style.color = color; }

document.getElementById("fontFamily") .addEventListener("change", function() { editor.style.fontFamily = this.value; });
document.getElementById("fontSize")   .addEventListener("change", function() { editor.style.fontSize = this.value; });

function clearEditor() { editor.innerHTML = ""; }
function resetEditor() {
    editor.style.backgroundColor = "white";
    editor.style.color = "black";
    editor.style.fontFamily = "Arial";
    editor.style.fontSize = "18px";

    document.getElementById("fontFamily").value = "Arial";
    document.getElementById("fontSize").value = "18px";
}

</script>

</body>
</html>
